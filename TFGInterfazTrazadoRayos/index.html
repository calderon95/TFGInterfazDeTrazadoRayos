<!-- Cargar Google Maps API de forma asíncrona -->
    <script>
        function initMap() {
            const map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 40.33526890778, lng: -3.8756072650463693 },
                zoom: 16
            });

     
            // Inicializar el servicio de Elevation
            elevator = new google.maps.ElevationService();

            // Escuchar los clics en el mapa
            map.addListener('click', function(event) {
                let lat = event.latLng.lat();
                let lng = event.latLng.lng();

                // Mostrar latitud y longitud en el DOM
                document.getElementById('muestraLatitud').innerText = `${lat.toFixed(4)}`;
				document.getElementById('muestraLongitud').innerText = `${lng.toFixed(4)}`;
				
                // Llamar a la función para obtener la elevación
                getElevation(lat, lng);
            });
        }
		
		function getElevation(lat, lng) {
            const location = { lat: lat, lng: lng };

            // Llamada al servicio de Elevation
            elevator.getElevationForLocations({
                locations: [location]
            }, function(results, status) {
                if (status === 'OK') {
                    if (results[0]) {
                        const elevation = results[0].elevation;
                        // Mostrar la elevación en el DOM
                        document.getElementById('muestraAltitud').innerText = `${elevation.toFixed(4)}`;
                    } else {
                        document.getElementById('muestraAltitud').innerText = 'No se encontraron resultados de elevación';
                    }
                } else {
                    document.getElementById('muestraAltitud').innerText = `Error al obtener la elevación: ${status}`;
                }
            });
        }
    </script>

<script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_KEY&callback=initMap">
</script>
